<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Worship With Me</title>
  <meta name="description" content="Sunday slides for your church. Lyrics on the projector, the run sheet on the laptop.">
  <meta property="og:title" content="Worship With Me">
  <meta property="og:description" content="Lyrics on the projector. The run sheet on the laptop.">
  <meta property="og:image" content="https://churchofx4u.github.io/church-x/share.jpg">
  <meta property="og:url" content="https://churchofx4u.github.io/church-x/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-maskable.svg">
  <meta name="theme-color" content="#14110e">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="mark">
        <img class="chi" src="./icon.svg" alt="" width="36" height="36">
        <div>
          <b>WORSHIP WITH ME</b>
          <span id="church-label">Your Church</span>
        </div>
      </div>
      <nav>
        <button data-view="plan">Sunday</button>
        <button data-view="media">Media</button>
        <button data-view="songs">Songs</button>
        <button data-view="run">Run sheet</button>
        <button data-view="people">New here</button>
        <button data-view="report">CCLI log</button>
        <button data-view="setup">Church</button>
        <button data-view="help">Help</button>
        <button data-view="about">About</button>
      </nav>
      <div class="foot">Present opens the projector window. This laptop keeps the run sheet. Arrows move slides. B blacks the screen. T shows the title. Esc leaves.<div class="version" id="version">Version 1.2</div><div class="version"><a href="./privacy.html">Privacy</a> · <a href="./terms.html">Terms</a> · <a href="mailto:churchofx4u@gmail.com">Help</a></div></div>
    </aside>
    <main class="main" id="view"></main>
  </div>
  <div id="stage" class="stage">
    <div id="screen" class="slide"></div>
    <div id="notes" class="notes"></div>
    <div class="stage-bar">
      <span id="pos"></span>
      <button class="ghost" id="exit-stage">Exit</button>
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
